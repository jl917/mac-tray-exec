name: Release

on:
  push:
    branches: [main]
  # 이미 만들어진 릴리스에 바이너리를 다시 올려야 할 때 수동 실행한다.
  workflow_dispatch:
    inputs:
      tag:
        description: "빌드해서 자산을 올릴 기존 릴리스 태그 (예: v2.0.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # main에 push될 때마다 실행. 커밋을 모아 릴리스 PR을 만들거나 갱신하고,
  # 그 PR이 병합되면 그때만 태그 + GitHub Release를 만든다.
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 릴리스 PR이 병합되어 실제 릴리스가 만들어졌을 때만 동작한다.
  # 그 외의 main push(릴리스 PR 생성/갱신만 한 경우)에서는 통째로 skip.
  # workflow_dispatch로는 입력받은 태그를 대상으로 언제든 다시 돌릴 수 있다.
  build:
    name: Build & upload macOS binary
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 릴리스 태그를 그대로 빌드한다 (버전 번호가 올라간 커밋).
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 태그 접두사 형식에 의존하지 않도록 체크아웃한 커밋에서 직접 읽는다.
      - name: Resolve version
        run: |
          set -euo pipefail
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          set -euo pipefail
          ./dist/mac-tray-exec --version
          ./dist/mac-tray-exec --help > /dev/null

      - name: Package
        run: |
          set -euo pipefail
          NAME="mac-tray-exec-${VERSION}-darwin-$(uname -m)"
          mkdir -p pkg
          cp dist/mac-tray-exec pkg/
          tar -czf "${NAME}.tar.gz" -C pkg mac-tray-exec
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" --clobber
